# LLM Routing Configuration
# Maps agents and actions to LLM profiles.

# Fixed agent routing: agent_type -> profile_name
fixed_agent_routing:
  quality_check: strong
  data_collection: fast
  report_generation: strong
  requirement_analysis: strong
  survey_simulation: fast

# Action routing: action_name -> profile_name
action_routing:
  # General reasoning/utility
  analyze: strong
  generate: strong
  write: strong
  review: strong
  judge: strong
  evaluate: strong
  search: fast
  scrape: fast
  extract: fast
  classify: fast
  translate: fast
  format: fast
  vision: strong

  # Quality assessment
  quality_judge: strong
  framework_match: fast
  claim_extraction: fast

  # Agent internal
  keyword_expand: fast
  decision_assist: fast
  task_structure: strong
  intent_analysis: strong
  revision_intent: fast

  # API actions
  framework_modify: fast
  section_inference: fast
  param_extraction: fast

  # Content operations
  translation: fast
  batch_revision: strong
  entity_extraction: fast
