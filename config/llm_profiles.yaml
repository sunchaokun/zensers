# LLM Profile Definitions
# Each profile defines a complete LLM configuration.
# Environment variables can be referenced with ${VAR_NAME} syntax.

profiles:
  strong:
    name: strong
    display_name: Strong (GPT-4o)
    provider: openai
    api_key: ${LLM_API_KEY}
    base_url: ${LLM_BASE_URL}
    model: gpt-4o
    fallback_model: gpt-4o-mini
    temperature: 0.7
    max_tokens: 4096
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    max_context_tokens: 128000
    cost_limit_per_call: 0.0
    enabled: true

  fast:
    name: fast
    display_name: Fast (GPT-4o-mini)
    provider: openai
    api_key: ${LLM_API_KEY}
    base_url: ${LLM_BASE_URL}
    model: gpt-4o-mini
    fallback_model: gpt-3.5-turbo
    temperature: 0.7
    max_tokens: 4096
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    max_context_tokens: 128000
    cost_limit_per_call: 0.0
    enabled: true

  local:
    name: local
    display_name: Local (Ollama)
    provider: ollama
    api_key: ""
    base_url: http://localhost:11434/v1
    model: qwen2.5
    fallback_model: ""
    temperature: 0.7
    max_tokens: 4096
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    max_context_tokens: 32768
    cost_limit_per_call: 0.0
    enabled: false

default_profile: fast
fallback_chain:
  - strong
  - fast
  - local
